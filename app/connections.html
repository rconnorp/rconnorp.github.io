<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Connections — Connor Peterson</title>

<style>
/* ============================================================
   Film Connections — Single-file CSS
   Palette mirrors the portfolio site (charcoal + burgundy + offwhite)
   ============================================================ */

:root {
  --bg:            #1A1D21;
  --surface:       #252B32;
  --surface-alt:   #2D343A;
  --border:        rgba(255,255,255,0.09);
  --text:          #EDE9E0;
  --text-muted:    rgba(237,233,224,0.52);
  --burgundy:      #7A1F2B;
  --burgundy-deep: #5A1620;
  --tile-bg:       #EDE9E0;
  --tile-text:     #1A1A1A;
  --tile-sel-bg:   #5A1620;
  --tile-sel-text: #EDE9E0;
  /* Muted, sophisticated difficulty palette */
  --yellow:  #B8904A;
  --green:   #3D6B4F;
  --blue:    #2E5485;
  --purple:  #5E3A7A;
  --gap: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--text-muted); text-decoration: none; }
a:hover { color: var(--text); }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

/* ---------- Header / Nav ---------- */
.app-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.875rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.nav-back {
  font-size: 0.8125rem;
  letter-spacing: 0.03em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: color 0.2s;
}
.nav-back:hover { color: var(--text); }

.nav-brand {
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
}

/* ---------- Puzzle Picker ---------- */
.puzzle-picker {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 1.125rem 1rem 0;
}

.puzzle-btn {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.4rem 0.875rem;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,0.15);
  color: var(--text-muted);
  background: transparent;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.puzzle-btn:hover {
  border-color: rgba(255,255,255,0.35);
  color: var(--text);
}
.puzzle-btn.active {
  background: var(--burgundy);
  border-color: var(--burgundy);
  color: #fff;
}

/* ---------- Game Wrapper ---------- */
.game-wrapper {
  max-width: 600px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.game-header {
  text-align: center;
  margin-bottom: 1.25rem;
}

.game-title {
  font-family: Georgia, 'Playfair Display', serif;
  font-size: 1.875rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  margin-bottom: 0.25rem;
}

.game-subtitle {
  font-size: 0.875rem;
  color: var(--text-muted);
}

.puzzle-label {
  display: inline-block;
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.5rem;
}

/* ---------- Solved Bars ---------- */
#solved-bars {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  margin-bottom: var(--gap);
}

.solved-bar {
  border-radius: 4px;
  padding: 0.875rem 1rem;
  text-align: center;
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.solved-bar-name {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.9);
  margin-bottom: 0.2rem;
}

.solved-bar-items {
  font-size: 0.9375rem;
  color: rgba(255,255,255,0.88);
  font-weight: 500;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}

/* ---------- Tile Grid ---------- */
#tile-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
  margin-bottom: 1.125rem;
}

.tile {
  min-height: 64px;
  background: var(--tile-bg);
  color: var(--tile-text);
  border-radius: 4px;
  border: 2px solid transparent;
  font-size: 0.8125rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.25;
  padding: 0.5rem 0.375rem;
  text-align: center;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s, transform 0.1s, opacity 0.2s;
  user-select: none;
  -webkit-user-select: none;
}

.tile:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}

.tile.selected {
  background: var(--tile-sel-bg);
  color: var(--tile-sel-text);
  border-color: rgba(255,255,255,0.25);
  transform: scale(1.03);
}

.tile:hover:not(.selected) {
  border-color: rgba(0,0,0,0.25);
}

/* Shake animation for wrong guess */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  15%      { transform: translateX(-7px); }
  45%      { transform: translateX(7px); }
  75%      { transform: translateX(-4px); }
}
.tile.shake {
  animation: shake 0.45s ease;
}

/* Solve pop */
@keyframes tileOut {
  from { opacity: 1; transform: scale(1); }
  50%  { transform: scale(1.06); }
  to   { opacity: 0; transform: scale(0.85); }
}
.tile.solving {
  animation: tileOut 0.3s ease forwards;
  pointer-events: none;
}

/* ---------- Mistake Indicators ---------- */
.mistakes-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.625rem;
  margin-bottom: 1.25rem;
}

.mistakes-label {
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.mistake-dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--text);
  transition: background 0.2s, transform 0.2s;
}

.dot.gone {
  background: var(--surface-alt);
  transform: scale(0.7);
}

/* ---------- Buttons ---------- */
.btn-row {
  display: flex;
  justify-content: center;
  gap: 0.625rem;
  flex-wrap: wrap;
}

.game-btn {
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 0.625rem 1.25rem;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,0.2);
  color: var(--text);
  background: transparent;
  transition: border-color 0.2s, background 0.2s, transform 0.1s;
}

.game-btn:hover {
  border-color: rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.05);
  transform: translateY(-1px);
}

.game-btn:active { transform: translateY(0); }

.game-btn.primary {
  background: var(--burgundy);
  border-color: var(--burgundy);
  color: #fff;
}

.game-btn.primary:hover {
  background: var(--burgundy-deep);
  border-color: var(--burgundy-deep);
}

.game-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

/* ---------- Toast ---------- */
#toast {
  position: fixed;
  top: 5rem;
  left: 50%;
  transform: translateX(-50%) translateY(-0.5rem);
  background: var(--text);
  color: var(--bg);
  font-size: 0.875rem;
  font-weight: 700;
  padding: 0.625rem 1.25rem;
  border-radius: 999px;
  white-space: nowrap;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------- Result Overlay ---------- */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(26, 29, 33, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 1.5rem;
  backdrop-filter: blur(4px);
}

#overlay.hidden { display: none; }

.overlay-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2.5rem 2rem;
  max-width: 440px;
  width: 100%;
  text-align: center;
  animation: popIn 0.3s ease both;
}

.overlay-emoji { font-size: 3rem; margin-bottom: 0.75rem; }

.overlay-title {
  font-family: Georgia, serif;
  font-size: 1.625rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0.5rem;
}

.overlay-subtitle {
  font-size: 0.9375rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.overlay-categories {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1.75rem;
}

.overlay-cat {
  border-radius: 4px;
  padding: 0.625rem 0.875rem;
  text-align: left;
}

.overlay-cat-name {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  margin-bottom: 0.15rem;
}

.overlay-cat-items {
  font-size: 0.875rem;
  color: rgba(255,255,255,0.75);
}

.overlay-btns {
  display: flex;
  gap: 0.625rem;
  justify-content: center;
  flex-wrap: wrap;
}

/* ---------- Responsive ---------- */
@media (max-width: 480px) {
  .tile {
    min-height: 56px;
    font-size: 0.6875rem;
    padding: 0.375rem 0.25rem;
  }

  .game-title { font-size: 1.5rem; }

  .game-wrapper { padding: 1.25rem 0.75rem 2.5rem; }

  :root { --gap: 6px; }

  .overlay-card { padding: 2rem 1.25rem; }
}

@media (max-width: 350px) {
  .tile { font-size: 0.625rem; min-height: 52px; }
}

/* ---------- Legend ---------- */
.difficulty-legend {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  padding: 0.75rem;
  background: var(--surface);
  border-radius: 4px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
</style>
</head>
<body>

<!-- ===== HEADER NAV ===== -->
<nav class="app-nav" aria-label="App navigation">
  <a href="../scratch/film.html" class="nav-back">&#8592; Film Page</a>
  <span class="nav-brand">Film Connections</span>
  <span style="width:6rem"></span><!-- spacer for centering -->
</nav>

<!-- ===== PUZZLE PICKER ===== -->
<div class="puzzle-picker" role="tablist" aria-label="Select puzzle">
  <button class="puzzle-btn active" data-puzzle="0" role="tab" aria-selected="true">Puzzle 1</button>
  <button class="puzzle-btn" data-puzzle="1" role="tab" aria-selected="false">Puzzle 2</button>
  <button class="puzzle-btn" data-puzzle="2" role="tab" aria-selected="false">Puzzle 3</button>
</div>

<!-- ===== GAME ===== -->
<div class="game-wrapper">

  <div class="game-header">
    <h1 class="game-title">Film Connections</h1>
    <p class="game-subtitle">Find four groups of four related films.</p>
    <span class="puzzle-label" id="puzzle-label">Puzzle 1 of 3</span>
  </div>

  <!-- Difficulty legend -->
  <div class="difficulty-legend" aria-hidden="true">
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Easier</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Medium</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Hard</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Tricky</div>
  </div>

  <!-- Solved category bars (filled in as categories are solved) -->
  <div id="solved-bars" aria-live="polite" aria-label="Solved categories"></div>

  <!-- 4×4 tile grid -->
  <div id="tile-grid" role="group" aria-label="Film tiles — select four to guess a category"></div>

  <!-- Mistake indicators -->
  <div class="mistakes-row" aria-live="polite">
    <span class="mistakes-label">Mistakes left:</span>
    <div class="mistake-dots" id="mistake-dots" aria-label="Remaining mistakes"></div>
  </div>

  <!-- Action buttons -->
  <div class="btn-row">
    <button class="game-btn" id="btn-shuffle" aria-label="Shuffle remaining tiles">Shuffle</button>
    <button class="game-btn" id="btn-deselect" aria-label="Deselect all tiles">Deselect All</button>
    <button class="game-btn primary" id="btn-submit" disabled aria-label="Submit selected tiles">Submit</button>
  </div>

</div>

<!-- ===== TOAST ===== -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- ===== WIN / LOSE OVERLAY ===== -->
<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlay-emoji"></div>
    <h2 class="overlay-title" id="overlay-title-text"></h2>
    <p class="overlay-subtitle" id="overlay-subtitle"></p>
    <div class="overlay-categories" id="overlay-categories"></div>
    <div class="overlay-btns">
      <button class="game-btn" id="btn-try-again">Try Again</button>
      <button class="game-btn primary" id="btn-next-puzzle">Next Puzzle</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Film Connections — Game Logic
   ============================================================ */

/* ---------- Puzzle Data ---------- */
const puzzles = [
  {
    title: "Puzzle 1",
    subtitle: "Academy",
    categories: [
      {
        name: "Academy Award Best Picture Winners",
        difficulty: "yellow",
        items: ["Casablanca", "Parasite", "Moonlight", "CODA"]
      },
      {
        name: "Directed by Christopher Nolan",
        difficulty: "green",
        items: ["Inception", "Memento", "Dunkirk", "Oppenheimer"]
      },
      {
        name: "Films Set in Outer Space",
        difficulty: "blue",
        items: ["Gravity", "Alien", "The Martian", "Apollo 13"]
      },
      {
        name: "Wall Street & Finance Films",
        difficulty: "purple",
        items: ["The Big Short", "Margin Call", "Wall Street", "Boiler Room"]
      }
    ]
  },
  {
    title: "Puzzle 2",
    subtitle: "Directors",
    categories: [
      {
        name: "Directed by Alfred Hitchcock",
        difficulty: "yellow",
        items: ["Psycho", "Rear Window", "Vertigo", "The Birds"]
      },
      {
        name: "Pixar Films",
        difficulty: "green",
        items: ["Toy Story", "Finding Nemo", "Up", "Inside Out"]
      },
      {
        name: "Color in the Title",
        difficulty: "blue",
        items: ["The Color Purple", "Black Swan", "Crimson Tide", "Blue Valentine"]
      },
      {
        name: "Set Within a Single Day",
        difficulty: "purple",
        items: ["Die Hard", "Training Day", "Cloverfield", "The Purge"]
      }
    ]
  },
  {
    title: "Puzzle 3",
    subtitle: "Craft",
    categories: [
      {
        name: "Directed by Martin Scorsese",
        difficulty: "yellow",
        items: ["Goodfellas", "Taxi Driver", "Raging Bull", "Hugo"]
      },
      {
        name: "Non-Pixar Animated Films",
        difficulty: "green",
        items: ["Spirited Away", "The Lion King", "Shrek", "Princess Mononoke"]
      },
      {
        name: "Number in the Title",
        difficulty: "blue",
        items: ["Se7en", "12 Angry Men", "127 Hours", "500 Days of Summer"]
      },
      {
        name: "Post-Apocalyptic Films",
        difficulty: "purple",
        items: ["Mad Max: Fury Road", "The Road", "Wall-E", "Children of Men"]
      }
    ]
  }
];

/* ---------- Difficulty Colours ---------- */
const DIFF_COLORS = {
  yellow: "var(--yellow)",
  green:  "var(--green)",
  blue:   "var(--blue)",
  purple: "var(--purple)"
};

/* ---------- Game State ---------- */
let state = {
  puzzleIndex: 0,
  tiles: [],         // [{text, catIndex}] — shuffled unsolved tiles
  selected: new Set(), // texts of selected tiles
  solved: new Set(),   // catIndex values that are solved
  mistakes: 0,
  status: "playing"  // 'playing' | 'won' | 'lost'
};

/* ---------- Utilities ---------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ---------- Init / Reset ---------- */
function initPuzzle(index) {
  const puzzle = puzzles[index];
  const allTiles = [];
  puzzle.categories.forEach((cat, catIndex) => {
    cat.items.forEach(text => allTiles.push({ text, catIndex }));
  });

  state = {
    puzzleIndex: index,
    tiles: shuffle(allTiles),
    selected: new Set(),
    solved: new Set(),
    mistakes: 0,
    status: "playing"
  };

  document.getElementById("overlay").classList.add("hidden");
  render();
}

/* ---------- Main Render ---------- */
function render() {
  renderPuzzleLabel();
  renderSolvedBars();
  renderTiles();
  renderMistakes();
  renderButtons();
}

function renderPuzzleLabel() {
  const p = puzzles[state.puzzleIndex];
  document.getElementById("puzzle-label").textContent =
    `${p.title} of ${puzzles.length} — ${p.subtitle}`;
}

function renderSolvedBars() {
  const container = document.getElementById("solved-bars");
  container.innerHTML = "";
  const puzzle = puzzles[state.puzzleIndex];

  // Render in difficulty order: yellow, green, blue, purple
  const order = ["yellow", "green", "blue", "purple"];
  order.forEach(diff => {
    const catIndex = puzzle.categories.findIndex(c => c.difficulty === diff);
    if (catIndex === -1 || !state.solved.has(catIndex)) return;
    const cat = puzzle.categories[catIndex];
    const bar = document.createElement("div");
    bar.className = "solved-bar";
    bar.style.backgroundColor = DIFF_COLORS[cat.difficulty];
    bar.innerHTML = `
      <div class="solved-bar-name">${escHtml(cat.name)}</div>
      <div class="solved-bar-items">${cat.items.map(escHtml).join(" · ")}</div>
    `;
    container.appendChild(bar);
  });
}

function renderTiles() {
  const grid = document.getElementById("tile-grid");
  grid.innerHTML = "";

  const unsolved = state.tiles.filter(t => !state.solved.has(t.catIndex));

  unsolved.forEach((tile, i) => {
    const btn = document.createElement("button");
    btn.className = "tile" + (state.selected.has(tile.text) ? " selected" : "");
    btn.textContent = tile.text;
    btn.setAttribute("tabindex", "0");
    btn.setAttribute("aria-pressed", state.selected.has(tile.text) ? "true" : "false");
    btn.setAttribute("aria-label", tile.text);
    btn.dataset.text = tile.text;

    btn.addEventListener("click", () => {
      if (state.status !== "playing") return;
      toggleTile(tile.text);
    });

    btn.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btn.click(); }
    });

    grid.appendChild(btn);
  });
}

function renderMistakes() {
  const container = document.getElementById("mistake-dots");
  container.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const dot = document.createElement("div");
    dot.className = "dot" + (i >= (4 - state.mistakes) ? " gone" : "");
    dot.setAttribute("aria-hidden", "true");
    container.appendChild(dot);
  }
}

function renderButtons() {
  const submitBtn = document.getElementById("btn-submit");
  submitBtn.disabled = (state.selected.size !== 4 || state.status !== "playing");
}

/* ---------- Tile Interaction ---------- */
function toggleTile(text) {
  if (state.selected.has(text)) {
    state.selected.delete(text);
  } else {
    if (state.selected.size >= 4) return; // max 4
    state.selected.add(text);
  }
  renderTiles();
  renderButtons();
}

/* ---------- Submit ---------- */
async function handleSubmit() {
  if (state.selected.size !== 4 || state.status !== "playing") return;

  const puzzle = puzzles[state.puzzleIndex];
  const selectedArr = [...state.selected];

  // Find if all 4 selected belong to same category
  let matchedCatIndex = -1;
  for (let i = 0; i < puzzle.categories.length; i++) {
    if (state.solved.has(i)) continue;
    const cat = puzzle.categories[i];
    const matches = selectedArr.filter(t => cat.items.includes(t)).length;
    if (matches === 4) { matchedCatIndex = i; break; }
  }

  if (matchedCatIndex !== -1) {
    // Correct!
    await animateSolve();
    state.solved.add(matchedCatIndex);
    state.selected.clear();

    if (state.solved.size === 4) {
      state.status = "won";
      render();
      await sleep(400);
      showOverlay(true);
    } else {
      render();
    }
  } else {
    // Wrong — check one away
    const oneAway = checkOneAway(selectedArr, puzzle);
    await animateWrong();
    state.mistakes++;
    state.selected.clear();

    if (state.mistakes >= 4) {
      state.status = "lost";
      render();
      await sleep(300);
      showToast("Better luck next time!", 2500);
      await sleep(600);
      showOverlay(false);
    } else {
      render();
      if (oneAway) showToast("One away…", 2000);
    }
  }
}

function checkOneAway(selectedArr, puzzle) {
  for (let i = 0; i < puzzle.categories.length; i++) {
    if (state.solved.has(i)) continue;
    const matches = selectedArr.filter(t => puzzle.categories[i].items.includes(t)).length;
    if (matches === 3) return true;
  }
  return false;
}

/* ---------- Animations ---------- */
async function animateSolve() {
  const grid = document.getElementById("tile-grid");
  const tiles = [...grid.querySelectorAll(".tile.selected")];
  tiles.forEach(t => t.classList.add("solving"));
  await sleep(320);
}

async function animateWrong() {
  const grid = document.getElementById("tile-grid");
  const tiles = [...grid.querySelectorAll(".tile.selected")];
  tiles.forEach(t => { t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake"); });
  await sleep(500);
  tiles.forEach(t => t.classList.remove("shake"));
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg, duration = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), duration);
}

/* ---------- Result Overlay ---------- */
function showOverlay(won) {
  const overlay   = document.getElementById("overlay");
  const emoji     = document.getElementById("overlay-emoji");
  const title     = document.getElementById("overlay-title-text");
  const subtitle  = document.getElementById("overlay-subtitle");
  const catsEl    = document.getElementById("overlay-categories");
  const nextBtn   = document.getElementById("btn-next-puzzle");
  const puzzle    = puzzles[state.puzzleIndex];

  emoji.textContent   = won ? "🎬" : "📽️";
  title.textContent   = won ? "Excellent!" : "Better luck next time";
  subtitle.textContent = won
    ? `You solved ${puzzle.title} with ${state.mistakes} mistake${state.mistakes === 1 ? "" : "s"}.`
    : "Here's what the groups were:";

  // Show all categories
  const order = ["yellow", "green", "blue", "purple"];
  catsEl.innerHTML = "";
  order.forEach(diff => {
    const cat = puzzle.categories.find(c => c.difficulty === diff);
    if (!cat) return;
    const div = document.createElement("div");
    div.className = "overlay-cat";
    div.style.backgroundColor = DIFF_COLORS[diff];
    div.innerHTML = `
      <div class="overlay-cat-name">${escHtml(cat.name)}</div>
      <div class="overlay-cat-items">${cat.items.map(escHtml).join(" · ")}</div>
    `;
    catsEl.appendChild(div);
  });

  // Next puzzle button
  const nextIndex = (state.puzzleIndex + 1) % puzzles.length;
  nextBtn.textContent = `Play Puzzle ${nextIndex + 1}`;

  overlay.classList.remove("hidden");
  overlay.querySelector(".overlay-card").focus?.();
}

/* ---------- Controls ---------- */
document.getElementById("btn-shuffle").addEventListener("click", () => {
  if (state.status !== "playing") return;
  const unsolved = state.tiles.filter(t => !state.solved.has(t.catIndex));
  const shuffled = shuffle(unsolved);
  const solvedTiles = state.tiles.filter(t => state.solved.has(t.catIndex));
  state.tiles = [...solvedTiles, ...shuffled];
  state.selected.clear();
  renderTiles();
  renderButtons();
});

document.getElementById("btn-deselect").addEventListener("click", () => {
  state.selected.clear();
  renderTiles();
  renderButtons();
});

document.getElementById("btn-submit").addEventListener("click", handleSubmit);

document.getElementById("btn-try-again").addEventListener("click", () => {
  initPuzzle(state.puzzleIndex);
});

document.getElementById("btn-next-puzzle").addEventListener("click", () => {
  const nextIndex = (state.puzzleIndex + 1) % puzzles.length;
  updatePuzzleButtons(nextIndex);
  initPuzzle(nextIndex);
});

/* ---------- Puzzle Picker ---------- */
document.querySelectorAll(".puzzle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const idx = parseInt(btn.dataset.puzzle, 10);
    updatePuzzleButtons(idx);
    initPuzzle(idx);
  });
});

function updatePuzzleButtons(activeIndex) {
  document.querySelectorAll(".puzzle-btn").forEach((btn, i) => {
    const isActive = i === activeIndex;
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-selected", isActive ? "true" : "false");
  });
}

/* ---------- Escape HTML ---------- */
function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------- Boot ---------- */
initPuzzle(0);
</script>
